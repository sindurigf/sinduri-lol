name: Accessibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref makes an in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything that is not the browser suite. Fast, and it runs beside the test
  # shards rather than before them, so a convention failure and a test failure
  # are both reported in the same few minutes.
  checks:
    name: Conventions, build, typecheck and format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # check-commits.sh walks base..HEAD, so the base commit has to be in
          # the clone. The default shallow fetch has only the tip.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # .nvmrc is the single source of truth; Workers Builds reads it too.
          node-version-file: '.nvmrc'
          cache: npm

      - name: Verify commit messages
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: sh scripts/check-commits.sh "$BASE_SHA..HEAD"

      - name: Verify the pull request description
        if: ${{ github.event_name == 'pull_request' }}
        env:
          # Environment variables, never `${{ }}` in the script body: a title
          # and a description are user-controlled text, and inline
          # substitution happens before the shell parses the line.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" |
            grep -qiE 'co-authored-by:.*(claude|anthropic)|generated with \[?claude code'
          then
            echo "::error::The pull request title or description carries AI attribution."
            exit 1
          fi
          echo "Pull request description: no AI attribution."

      - name: Verify design tokens
        run: npm run check:tokens

      - name: Verify documentation links
        run: npm run check:links

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      # The contact endpoint, through the Worker with local D1. Its own config,
      # because the sharded suite runs against a static server with no endpoint;
      # see playwright.worker.config.ts. Here rather than in the shards because
      # it is HTTP only and needs no browser, and running it once per shard
      # would repeat the same requests six times.
      - name: Contact endpoint tests
        run: npm run test:worker

  # The browser suite, split across parallel runners.
  #
  # Measured 2026-09-12: on one runner the suite step was 866s of a 15.5-minute
  # job, and everything else together was about a minute. `fullyParallel` is on
  # in playwright.config.ts, so a shard splits by test rather than by file and
  # the shards come out even.
  #
  # Each shard is its own runner, with two workers as before, rather than more
  # workers competing for one machine.
  test:
    name: Playwright (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every shard reports, so one failing shard does not hide what the others
      # found.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Read the pin rather than repeat it: playwright.config.ts records why the
      # version is exact, and a range here would key the cache to a version npm
      # had stopped installing.
      - name: Read the pinned Playwright version
        id: playwright
        run: |
          version=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::@playwright/test is \"$version\" in package.json, not an exact version. The pin is deliberate; see playwright.config.ts."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Exact key, no restore-keys: `npx playwright install` prunes builds the
      # installed version does not reference, so a near-miss is rewritten anyway.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # All three, because CI defines all three projects. WebKit runs here and
      # not on an Ubuntu 25.10 development machine; playwright.config.ts has the
      # ICU reason and the container command for running it locally.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Fails on any axe violation. No rule is excluded; see ACCESSIBILITY.md.
      - name: Accessibility tests
        run: npm run test:a11y -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  required:
    # DO NOT RENAME without updating the branch ruleset in the same change. This
    # string is the GitHub status context the ruleset on `main` requires, and
    # editing it alone fails nothing: it leaves the ruleset waiting for a check
    # that never reports, so every pull request stops being mergeable.
    #
    # A gate over the jobs above rather than the work itself, so the ruleset
    # names one context however the suite is split. It was called "Build,
    # typecheck, and axe" until 2026-09-12, which stopped describing it when the
    # suite was sharded.
    name: Required checks
    runs-on: ubuntu-latest
    needs: [checks, test]

    # `always()` is load-bearing. Without it a failed dependency makes this job
    # SKIPPED, and a ruleset treats a skipped required check as satisfied: the
    # branch would merge with a red shard. With it, this job always runs and
    # fails unless every dependency succeeded.
    if: ${{ always() }}
    timeout-minutes: 5

    steps:
      - name: Require every job above to have succeeded
        env:
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.test.result }}
        run: |
          echo "checks: $CHECKS"
          echo "tests:  $TESTS"
          if [ "$CHECKS" != "success" ] || [ "$TESTS" != "success" ]; then
            echo "::error::A required job did not succeed (checks=$CHECKS, tests=$TESTS)."
            exit 1
          fi
