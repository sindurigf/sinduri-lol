name: Accessibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref makes an in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  a11y:
    # DO NOT RENAME. This string is the GitHub status context that the branch
    # ruleset on `main` requires. Editing it does not fail anything; it makes
    # the required check disappear, and `main` silently loses its protection.
    #
    # It now undersells the job, which also checks commit messages, the pull
    # request description, design tokens and documentation links. The checks
    # were added here rather than as a second job precisely so they inherit
    # this context and cannot be merged past while red. An inaccurate name is
    # the cheaper of the two problems.
    name: Build, typecheck, and axe
    runs-on: ubuntu-latest
    # Raised from 15 when Firefox doubled the suite to 974 tests. The chromium
    # half took 4.9 minutes on this runner; the headroom is for the second
    # browser plus the install, not for a suite that has started to crawl.
    timeout-minutes: 25

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          # check-commits.sh walks base..HEAD, so the base commit has to be in
          # the clone. The default shallow fetch has only the tip and the
          # range would not resolve.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # .nvmrc is the single source of truth. Cloudflare Pages reads the
          # same file for the deploy build, so CI cannot drift away from
          # production by pinning a version here as well.
          node-version-file: '.nvmrc'
          cache: npm

      # The four convention checks run before `npm ci` on purpose. All of them
      # are stdlib Node or POSIX sh with no dependencies, so a branch that
      # breaks a convention fails in seconds rather than after a Playwright
      # browser download. They were checkboxes in the pull request template
      # until every one of them was ticked while false.

      - name: Verify commit messages
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: sh scripts/check-commits.sh "$BASE_SHA..HEAD"

      - name: Verify the pull request description
        if: ${{ github.event_name == 'pull_request' }}
        env:
          # Passed as environment variables, never interpolated into the
          # script body. A title and a description are user-controlled text,
          # and `${{ ... }}` is substituted before the shell parses the line,
          # so splicing them inline is a command injection waiting for someone
          # to open a pull request with a backtick in the title.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # .githooks/commit-msg cannot reach this text: it sees commit
          # messages only. This is the one place the description is checked.
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" |
            grep -qiE 'co-authored-by:.*(claude|anthropic)|generated with \[?claude code'
          then
            echo "::error::The pull request title or description carries AI attribution."
            exit 1
          fi
          echo "Pull request description: no AI attribution."

      - name: Verify design tokens
        run: npm run check:tokens

      - name: Verify documentation links
        run: npm run check:links

      - name: Install dependencies
        run: npm ci

      # --with-deps pulls the system libraries the browsers need on a bare
      # runner. Chromium and Firefox, matching the two projects in the config.
      #
      # WebKit is deliberately absent, and playwright.config.ts says why at
      # length: it is not that the project was forgotten, it is that nobody has
      # run the suite against it even once. Adding it here would make CI the
      # first place it ever ran, which is the wrong place to find out.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      # Fails on any axe violation. No rule is excluded; see ACCESSIBILITY.md.
      - name: Accessibility tests
        run: npm run test:a11y

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
