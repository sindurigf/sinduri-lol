name: Accessibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref makes an in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  a11y:
    name: Build, typecheck, and axe
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # .nvmrc is the single source of truth. Cloudflare Pages reads the
          # same file for the deploy build, so CI cannot drift away from
          # production by pinning a version here as well.
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --with-deps pulls the system libraries the browser needs on a bare
      # runner. Chromium only, matching the single project in the config.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      # Fails on any axe violation. No rule is excluded; see ACCESSIBILITY.md.
      - name: Accessibility tests
        run: npm run test:a11y

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
